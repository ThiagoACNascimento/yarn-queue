services:
  postgres:
    container_name: 'yarn-queue-dev'
    image: 'postgres:16-alpine'
    env_file:
      - '.env.development'
    ports:
      - '5432:5432'
    volumes:
      - yarnqueue_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  yarnqueue_data:
